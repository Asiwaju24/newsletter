{% extends "base.html" %}
{% block title %}{{ title }} · {{ SITE_NAME }}{% endblock %}
{% block content %}
<div class="container narrow center-card" style="--measure: 28rem">
  <div class="panel">
    <h1>{{ title }}</h1>
    <p class="muted">{{ message }}</p>
    {% if link_url %}<a class="btn" href="{{ link_url }}">{{ link_label }}</a>{% endif %}
  </div>
</div>
{% endblock %}
