<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="light">
<title>{{ issue.subject }}</title>
<style>
  .body { font-family: Inter, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; font-size: 17px; line-height: 1.75; color: #0e1126; }
  .body h1, .body h2, .body h3 { line-height: 1.25; margin: 1.6em 0 0.5em; letter-spacing: -0.01em; }
  .body h1 { font-size: 26px; } .body h2 { font-size: 22px; } .body h3 { font-size: 19px; }
  .body p, .body ul, .body ol { margin: 0 0 1.1em; }
  .body a { color: #4a3ae0; }
  .body img { max-width: 100%; height: auto; border-radius: 10px; }
  .body blockquote { margin: 1.2em 0; padding-left: 16px; border-left: 3px solid #4a3ae0; color: #5a6180; }
  .body pre { background: #eef0fa; padding: 12px; border-radius: 8px; overflow-x: auto; font-size: 14px; }
  .body code { background: #eef0fa; padding: 1px 5px; border-radius: 4px; font-size: 0.9em; }
  .body pre code { background: none; padding: 0; }
  .body hr { border: 0; border-top: 1px solid #e1e4f2; margin: 2em 0; }
</style></head>
<body style="margin:0;padding:0;background:#f5f6fc;">
{% if issue.preheader %}<div style="display:none;max-height:0;overflow:hidden;opacity:0;color:transparent;">{{ issue.preheader }}</div>{% endif %}
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f5f6fc;"><tr><td align="center" style="padding:24px 12px;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:600px;background:#ffffff;border:1px solid #e1e4f2;border-radius:16px;overflow:hidden;">
    <tr><td style="height:4px;background:#4a3ae0;font-size:0;line-height:0;">&nbsp;</td></tr>
    <tr><td style="padding:28px 32px 0;font-family:Inter,system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;font-size:14px;font-weight:600;color:#4a3ae0;">{{ newsletter.title }}</td></tr>
    <tr><td style="padding:6px 32px 0;"><h1 style="margin:0;font-family:Inter,system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;font-size:30px;line-height:1.2;letter-spacing:-0.02em;color:#0e1126;">{{ issue.subject }}</h1></td></tr>
    <tr><td class="body" style="padding:20px 32px 12px;font-family:Inter,system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;font-size:17px;line-height:1.75;color:#0e1126;">{{ body_html|safe }}</td></tr>
    <tr><td style="padding:20px 32px 28px;border-top:1px solid #e1e4f2;font-family:Inter,system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;font-size:13px;line-height:1.6;color:#5a6180;">
      You're getting this because you signed up for {{ newsletter.title }}.<br>
      {% if web_url %}<a href="{{ web_url }}" style="color:#5a6180;">Read it in your browser</a> · {% endif %}<a href="{{ unsubscribe_url }}" style="color:#5a6180;">Unsubscribe</a>
    </td></tr>
  </table>
</td></tr></table>
</body></html>
